[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsfolio"
dynamic = ["version"]
description = "Research PDF management with ADS, Crossref, DataCite, and local references"
authors = [
    {name = "Yoonsoo P. Bach", email = "ysbach20766@gmail.com"}
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "ads",
    "scixplorer",
    "astronomy",
    "astrophysics",
    "heliophysics",
    "physics",
    "life-sciences",
    "space-biology",
    "microgravity",
    "materials-science",
    "earth-science",
    "atmospheric-science",
    "oceanography",
    "planetary-science",
    "bibliography",
    "scientific-literature",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "click>=8.0",
    "platformdirs>=3.0",
    "tqdm>=4.66",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "bibtexparser>=1.4.3,<2",
    "pyparsing>=3.0",
]

[project.optional-dependencies]
full = [
    "pymupdf>=1.24",
    "watchdog>=3.0",
    "iso4>=0.0.2",
]
gui = ["PySide6>=6.6"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.2",
    "isort>=5.13",
    "ruff>=0.6",
]
desktop = ["pyinstaller>=6.16,<7"]
docs = [
    "sphinx>=7.4",
    "myst-parser>=2.0",
    "sphinx-click>=6.0",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/ysBach/adsfolio"
Documentation = "https://github.com/ysBach/adsfolio#readme"
Repository = "https://github.com/ysBach/adsfolio"
Issues = "https://github.com/ysBach/adsfolio/issues"

[project.scripts]
adsfolio = "adsfolio.cli.commands:main"
adsfolio-gui = "adsfolio.cli.commands:gui_command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adsfolio.gui" = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "adsfolio.__version__"}

[tool.ruff]
target-version = "py310"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
